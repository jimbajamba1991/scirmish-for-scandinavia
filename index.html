
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Minimal Page</title>
    <style>
        /* Style for the dynamic canvas shown below the table */
        #dynamic-table-canvas {
            display: none;
            position: fixed;
            left: calc(20vw + 750px);
            top: calc(50% - 340px);
            margin: 0;
            background: #eaf4fb;
            border: 2px solid #7fa8c9;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        }
        /* Style for table buttons in the contact-message */
        #contact-message button {
            transition: background 0.2s, color 0.2s, transform 0.2s;
        }
        #contact-message button:not(.unclickable):hover {
            background: #4caf50;
            color: #fff;
            transform: scale(1.08);
        }
        #contact-message button.unclickable {
            background: #e0e0e0 !important;
            color: #888 !important;
            cursor: default !important;
            pointer-events: none;
        }
        /* Center the contact-message both horizontally and vertically */
        #contact-message {
            display: none;
            position: fixed;
            top: 50%;
            left: 20vw;
            transform: translateY(-50%);
            min-width: 320px;
            max-width: 600px;
            background: #fffbe6;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            padding: 2rem 2.5rem;
            text-align: center;
            font-size: 1.2rem;
            color: #111;
            font-weight: bold;
            z-index: 200;
        }
        .top-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 48px;
            background: #7fa8c9;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            z-index: 100;
        }
        .header-btn {
            background: #fff;
            color: #49739a;
            border: none;
            border-radius: 4px;
            padding: 0.4rem 1.2rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            transition: background 0.2s, color 0.2s;
            margin: 0 0.75rem;
        }
        .header-btn:hover {
            background: #49739a;
            color: #fff;
        }
        .retro-canvas {
            margin-top: 200px;
            margin-bottom: 2rem;
            background: #eaf4fb;
            border: 2px solid #7fa8c9;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        }
        .letter-row {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            margin-top: 100px;
        }
        .letter-img {
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            border-radius: 12px;
            max-width: 320px;
            width: 30vw;
        }
        #bigAImg.letter-img {
            max-width: 420px;
            width: 40vw;
            cursor: pointer;
        }
        body {
            background: #c2e1ff !important;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            min-height: 100vh;
            width: 100vw;
        }
        h1 {
            color: #7fa8c9;
            font-weight: 700;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0 #fff, 0 0 8px #f7c873;
        }
    </style>
    <script>
        window.addEventListener('DOMContentLoaded', function() {
            // Get all header buttons
            const headerBtns = document.querySelectorAll('.header-btn');
            // Get the contact message container
            const contactMsg = document.getElementById('contact-message');
            // Find the 'Handledning', 'Startsida', 'Kontakt', and 'Om Monsterbokstäverna' buttons by their text
            const handledningBtn = Array.from(headerBtns).find(btn => btn.textContent.trim() === 'Handledning');
            const startsidaBtn = Array.from(headerBtns).find(btn => btn.textContent.trim() === 'Startsida');
            const kontaktBtn = Array.from(headerBtns).find(btn => btn.textContent.trim() === 'Kontakt');
            const omMonsterBtn = Array.from(headerBtns).find(btn => btn.textContent.trim() === 'Om Monsterbokstäverna');
            // Get the canvas and the row of letter images
            const canvas = document.getElementById('retroCanvas');
            const letterRow = document.querySelector('.letter-row');

            // When 'Handledning' is clicked, show a 3x8 table of buttons
            if (handledningBtn && contactMsg) {
                handledningBtn.addEventListener('click', function() {
                    let tableHtml = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;"><table style="border-collapse:separate;border-spacing:1.2rem 1.2rem;">';
                    for (let y = 0; y < 8; y++) {
                        tableHtml += '<tr>';
                        for (let x = 0; x < 3; x++) {
                            // Only show the first button in the first row
                            if (y === 0 && x > 0) continue;
                            let label = '';
                            let extraClass = '';
                            if (x === 0) {
                                if (y === 0) {
                                    label = 'Svårighetsnivå';
                                    extraClass = 'unclickable';
                                } else label = 'Nivå ' + y;
                            } else if (x === 1) label = 'Instruktionsfilm';
                            else if (x === 2) label = 'Övningar';
                            tableHtml += `<td><button class="${extraClass}" style=\"padding:1.2rem 2.5rem;font-size:1.1rem;border-radius:8px;border:none;box-shadow:0 2px 8px rgba(0,0,0,0.08);cursor:pointer;\">${label}</button></td>`;
                        }
                        tableHtml += '</tr>';
                    }
                    tableHtml += '</table></div>';
                    contactMsg.innerHTML = tableHtml;
                    contactMsg.style.display = 'block';
                    // Hide the dynamic canvas when table is redrawn
                    const dynCanvas = document.getElementById('dynamic-table-canvas');
                    if (dynCanvas) dynCanvas.style.display = 'none';

                    // Add click listeners to all table buttons except the unclickable one
                    setTimeout(function() {
                        const tableButtons = contactMsg.querySelectorAll('button:not(.unclickable)');
                        tableButtons.forEach(btn => {
                            btn.addEventListener('click', function() {
                                if (dynCanvas) dynCanvas.style.display = 'block';
                            });
                        });
                    }, 0);
                });
            }

            // Loop through all header buttons
            headerBtns.forEach(btn => {
                // Hide the dynamic canvas when any header button is clicked
                if (btn !== startsidaBtn) {
                    // For all buttons except 'Startsida', hide the canvas and letter images when clicked
                    btn.addEventListener('click', function() {
                        if (canvas) canvas.style.display = 'none'; // Hide the canvas
                        if (letterRow) letterRow.style.display = 'none'; // Hide the letter images row
                        const dynCanvas = document.getElementById('dynamic-table-canvas');
                        if (dynCanvas) dynCanvas.style.display = 'none';
                    });
                } else {
                    // For the 'Startsida' button, show the canvas and letter images when clicked
                    btn.addEventListener('click', function() {
                        if (canvas) canvas.style.display = ''; // Show the canvas (reset to default)
                        if (letterRow) letterRow.style.display = ''; // Show the letter images row (reset to default)
                        const dynCanvas = document.getElementById('dynamic-table-canvas');
                        if (dynCanvas) dynCanvas.style.display = 'none';
                    });
                }
            });

            // When 'Kontakt' is clicked, show the email address
            if (kontaktBtn && contactMsg) {
                kontaktBtn.addEventListener('click', function() {
                    contactMsg.textContent = 'Jimgustafsson91@gmail.com';
                    contactMsg.style.display = 'block';
                });
            }

            // When 'Om Monsterbokstäverna' is clicked, show info text
            if (omMonsterBtn && contactMsg) {
                omMonsterBtn.addEventListener('click', function() {
                    contactMsg.innerHTML = `Modernt, barnvänligt och motiverande material som tydliggör koppling bokstavsnamn - bokstavsljud, liten-stor bokstav och som använder inbyggda munbilder för att öka medvetenhet kring hur vi kan använda munnen för att säga de olika bokstavsljuden.<br><br>

    Vi erbjuder ett tydligt stöd digitalt med handledning samt ett ansikte i 3d som med animation visar hur man använder munnen, läppar, tunga och tänder för att säga bokstävernas olika ljud.<br><br>

    Metoden bryter ner övningar i svårighetsnivå med ett tydligt stöd för<br>
    Att introducera och förklara övningen<br>
    Visuellt stöd för att skilja övningarna åt<br>
    Att enkelt få en bild av barnets nuvarande förmåga så träningen blir utifrån barnets proximala utvecklingszon.`;
                    contactMsg.style.display = 'block';
                });
            }

            // When any other header button is clicked (except Kontakt, Om Monsterbokstäverna, Handledning), hide the contact message
            headerBtns.forEach(btn => {
                if (btn.textContent.trim() !== 'Kontakt' && btn.textContent.trim() !== 'Om Monsterbokstäverna' && btn.textContent.trim() !== 'Handledning') {
                    btn.addEventListener('click', function() {
                        if (contactMsg) contactMsg.style.display = 'none';
                    });
                }
            });
        });
    </script>
</head>

        stopVideo();

        video.muted = true; // mute video, play audio separately
        video.playsInline = true;
        video.style.display = 'none';
        document.body.appendChild(video);

        video.addEventListener('play', function drawFrame() {
            if (!videoPlaying) return;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            animationFrameId = requestAnimationFrame(drawFrame);
        });
        video.addEventListener('ended', function() {
            videoPlaying = false;
            document.body.removeChild(video);
        });

    }

    function stopVideo() {
        if (!videoPlaying) return;
