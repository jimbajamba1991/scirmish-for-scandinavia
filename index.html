
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Minimal Page</title>
    <style>
        body {
            background: linear-gradient(135deg, #b3d8f7 0%, #f7c873 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        h1 {
            color: #7fa8c9;
            font-weight: 700;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0 #fff, 0 0 8px #f7c873;
        }
    </style>
</head>
<body>
    <div style="display:flex;flex-direction:column;align-items:center;">
        <canvas id="retroCanvas" width="600" height="600" style="margin-top:900px;margin-bottom:2rem;background:#eaf4fb;border:2px solid #7fa8c9;border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,0.08);"></canvas>
        <div style="display:flex;flex-direction:row;align-items:center;justify-content:center;gap:2rem;margin-top:calc(45vh - 400px);">
            <img src="bigMredo3.png" id="bigMImg" alt="Big M Retro" style="max-width:420px;width:40vw;box-shadow:0 4px 24px rgba(0,0,0,0.08);border-radius:12px;cursor:pointer;" />
            <img src="bigNredo2 (1).png" alt="Big N Retro" style="max-width:320px;width:30vw;box-shadow:0 4px 24px rgba(0,0,0,0.08);border-radius:12px;" />
        </div>
    </div>
    <script>
    // Play video on canvas when bigMredo3.png is clicked
    const bigMImg = document.getElementById('bigMImg');
    const canvas = document.getElementById('retroCanvas');
    let videoPlaying = false;
    let video;

    bigMImg.addEventListener('click', function() {
        if (videoPlaying) return;
        videoPlaying = true;
        video = document.createElement('video');
        video.src = 'atalk.mp4';
        video.width = 600;
        video.height = 600;
        video.autoplay = true;
        video.muted = false;
        video.playsInline = true;
        video.style.display = 'none';
        document.body.appendChild(video);
        video.play();
        function drawFrame() {
            if (!videoPlaying) return;
            if (video.paused || video.ended) {
                videoPlaying = false;
                document.body.removeChild(video);
                return;
            }
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            requestAnimationFrame(drawFrame);
        }
        video.addEventListener('play', drawFrame);
        video.addEventListener('ended', function() {
            videoPlaying = false;
            document.body.removeChild(video);
        });
    });
    </script>
</body>
</html>
