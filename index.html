    <script>
        window.addEventListener('DOMContentLoaded', function() {
            // Get all header buttons
            const headerBtns = document.querySelectorAll('.header-btn');
            // Get the contact message container
            const contactMsg = document.getElementById('contact-message');
            // Find the header buttons by their text
            const handledningBtn = Array.from(headerBtns).find(btn => btn.textContent.trim() === 'Handledning');
            const startsidaBtn = Array.from(headerBtns).find(btn => btn.textContent.trim() === 'Startsida');
            const kontaktBtn = Array.from(headerBtns).find(btn => btn.textContent.trim() === 'Kontakt');
            const omMonsterBtn = Array.from(headerBtns).find(btn => btn.textContent.trim() === 'Om Monsterbokstäverna');
            const utvecklingsbloggBtn = Array.from(headerBtns).find(btn => btn.textContent.trim() === 'Utvecklingsblogg');
            // When 'Utvecklingsblogg' is clicked, show the blog entry
            if (utvecklingsbloggBtn && contactMsg) {
                utvecklingsbloggBtn.addEventListener('click', function() {
                    contactMsg.innerHTML = `<div style='text-align:left;white-space:pre-line;'><b>2025-08-24</b><br>Idag använde jag min telefon för att visa en första, enkel version av webbsidan med bokstäver och 3d-mun för en femåring.\n\nJag frågade om barnet visste hur dessa bokstäver lät. Barnet svarade relativt enkelt att bokstaven A lät, “aaaaa”. När jag frågade om hur bokstaven L lät så blev barnet något osäker och svarade efter en stund “eeeeeel”.\n\nDetta tycker jag är så spännande eftersom min förhoppning är att materialet ska hjälpa barn att bli medvetna om samt förstå de grundläggande principerna och reglerna som finns kring bokstäver, läsande & skrivande. Det är ganska mycket begärt att barnen ska lista ut alla dessa regler själva.\n\nDet blev enkelt för mig att förklara att alla bokstäver har ett eget bokstavsljud - och vi kunde träna på att säga och komma ihåg de olika bokstavsljuden. Dessutom är det roligt att se hur det digitala mediet kan skapa en sån intuitiv nyfikenhet hos barnet när det används i ett medvetet syfte.</div>`;
                    contactMsg.style.display = 'block';
                    if (canvas) canvas.style.display = 'none';
                    if (letterRow) letterRow.style.display = 'none';
                    const dynCanvas = document.getElementById('dynamic-table-canvas');
                    if (dynCanvas) dynCanvas.style.display = 'none';
                });
            }
            // Get the canvas, the row of letter images, and the carousel container
            const canvas = document.getElementById('retroCanvas');
            const letterRow = document.querySelector('.letter-row');
            const letterCarouselContainer = document.querySelector('.letter-carousel-container');

            // When 'Handledning' is clicked, show a 3x8 table of buttons
            if (handledningBtn && contactMsg) {
                handledningBtn.addEventListener('click', function() {
                    let tableHtml = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;"><table style="border-collapse:separate;border-spacing:1.2rem 1.2rem;">';
                    for (let y = 0; y < 8; y++) {
                        tableHtml += '<tr>';
                        for (let x = 0; x < 3; x++) {
                            // Only show the first button in the first row
                            if (y === 0 && x > 0) continue;
                            let label = '';
                            let extraClass = '';
                            if (x === 0) {
                                if (y === 0) {
                                    label = 'Svårighetsnivå';
                                    extraClass = 'unclickable';
                                } else label = 'Nivå ' + y;
                            } else if (x === 1) label = 'Instruktionsfilm';
                            else if (x === 2) label = 'Övningar';
                            tableHtml += `<td><button class="${extraClass}" style=\"padding:1.2rem 2.5rem;font-size:1.1rem;border-radius:8px;border:none;box-shadow:0 2px 8px rgba(0,0,0,0.08);cursor:pointer;\">${label}</button></td>`;
                        }
                        tableHtml += '</tr>';
                    }
                    tableHtml += '</table></div>';
                    contactMsg.innerHTML = tableHtml;
                    contactMsg.style.display = 'block';
                    // Hide the dynamic canvas when table is redrawn
                    const dynCanvas = document.getElementById('dynamic-table-canvas');
                    if (dynCanvas) dynCanvas.style.display = 'none';

                    // Add click listeners to all table buttons except the unclickable one
                    setTimeout(function() {
                        const tableButtons = contactMsg.querySelectorAll('button:not(.unclickable)');
                        tableButtons.forEach(btn => {
                            btn.addEventListener('click', function() {
                                if (dynCanvas) dynCanvas.style.display = 'block';
                            });
                        });
                    }, 0);
                });
            }

            // Loop through all header buttons
            headerBtns.forEach(btn => {
                // Hide the dynamic canvas when any header button is clicked
                if (btn !== startsidaBtn) {
                    // For all buttons except 'Startsida', hide the canvas, letter images row, and carousel when clicked
                    btn.addEventListener('click', function() {
                        if (canvas) canvas.style.display = 'none';
                        if (letterRow) letterRow.style.display = 'none';
                        if (letterCarouselContainer) letterCarouselContainer.style.display = 'none';
                        const dynCanvas = document.getElementById('dynamic-table-canvas');
                        if (dynCanvas) dynCanvas.style.display = 'none';
                        // Remove summary image if present
                        const prev = document.getElementById('summary-img-standalone');
                        if (prev) prev.remove();
                    });
                } else {
                    // For the 'Startsida' button, show the canvas, letter images row, and carousel when clicked
                    btn.addEventListener('click', function() {
                        if (canvas) canvas.style.display = '';
                        if (letterRow) letterRow.style.display = '';
                        if (letterCarouselContainer) letterCarouselContainer.style.display = '';
                        const dynCanvas = document.getElementById('dynamic-table-canvas');
                        if (dynCanvas) dynCanvas.style.display = 'none';
                        // Remove summary image if present
                        const prev = document.getElementById('summary-img-standalone');
                        if (prev) prev.remove();
                    });
                }
            });

            // When 'Kontakt' is clicked, show the email address
            if (kontaktBtn && contactMsg) {
                kontaktBtn.addEventListener('click', function() {
                    contactMsg.textContent = 'Jimgustafsson91@gmail.com';
                    contactMsg.style.display = 'block';
                });
            }

            // When 'Om Monsterbokstäverna' is clicked, show info text
            if (omMonsterBtn && contactMsg) {
                omMonsterBtn.addEventListener('click', function() {
                    contactMsg.style.display = 'none';
                    // Remove any previous summary image
                    const prev = document.getElementById('summary-img-standalone');
                    if (prev) prev.remove();
                    // Add the summary image directly to the body (centered)
                    const img = document.createElement('img');
                    img.src = 'summary.png';
                    img.alt = 'Sammanfattning';
                    img.id = 'summary-img-standalone';
                    img.style.maxWidth = '98vw';
                    img.style.height = 'auto';
                    img.style.display = 'block';
                    img.style.margin = '80px auto 0 auto';
                    img.style.boxShadow = '0 4px 24px rgba(0,0,0,0.08)';
                    img.style.borderRadius = '12px';
                    document.body.appendChild(img);
                });
            }

            // When any other header button is clicked (except Kontakt, Om Monsterbokstäverna, Handledning), hide the contact message
            headerBtns.forEach(btn => {
                if (
                    btn.textContent.trim() !== 'Kontakt' &&
                    btn.textContent.trim() !== 'Om Monsterbokstäverna' &&
                    btn.textContent.trim() !== 'Handledning' &&
                    btn.textContent.trim() !== 'Utvecklingsblogg'
                ) {
                    btn.addEventListener('click', function() {
                        if (contactMsg) contactMsg.style.display = 'none';
                    });
                }
            });
        });
    </script>

    <script>
    // Letter carousel logic with smooth dragging and 3-at-a-time view
    document.addEventListener('DOMContentLoaded', function() {
        const carousel = document.getElementById('letterCarousel');
        const images = Array.from(carousel.querySelectorAll('.letter-img'));
        const imagesPerPage = 3;
        let currentPage = 0;
    let isDragging = false;
    let startX = 0;
    let currentX = 0;
    let dragOffset = 0;
    let lastOffset = 0;
    let dragMoved = false;
        const pageWidthVW = 100; // Each page is 100vw wide
        const maxPage = Math.ceil(images.length / imagesPerPage) - 1;

        function setTransition(enable) {
            carousel.style.transition = enable ? 'transform 0.3s cubic-bezier(.4,0,.2,1)' : 'none';
        }
        function updateCarousel(offsetVW) {
            carousel.style.transform = `translateX(${offsetVW}vw)`;
        }
        function playSwipeSound() {
            const audio = document.createElement('audio');
            audio.src = 'swipeSound.mp3';
            audio.autoplay = true;
            audio.onended = () => audio.remove();
            document.body.appendChild(audio);
        }
        function showPage(index, playSound = false) {
            const newPage = Math.max(0, Math.min(index, maxPage));
            if (playSound && newPage !== currentPage) playSwipeSound();
            currentPage = newPage;
            setTransition(true);
            updateCarousel(-currentPage * pageWidthVW);
            lastOffset = -currentPage * pageWidthVW;
        }

        // Touch events for smooth swipe
        carousel.addEventListener('touchstart', function(e) {
            if (e.touches.length !== 1) return;
            isDragging = true;
            dragMoved = false;
            setTransition(false);
            startX = e.touches[0].clientX;
            dragOffset = 0;
            e.preventDefault(); // Prevent page scroll
        }, { passive: false });
        carousel.addEventListener('touchmove', function(e) {
            if (!isDragging) {
                e.preventDefault();
                return;
            }
            currentX = e.touches[0].clientX;
            if (Math.abs(currentX - startX) > 10) dragMoved = true;
            dragOffset = ((currentX - startX) / window.innerWidth) * 100; // in vw
            let offsetVW = lastOffset + dragOffset;
            // Clamp so you can't drag past ends
            if (offsetVW > 0) offsetVW = 0;
            if (offsetVW < -maxPage * pageWidthVW) offsetVW = -maxPage * pageWidthVW;
            updateCarousel(offsetVW);
            e.preventDefault();
        }, { passive: false });
        carousel.addEventListener('touchend', function(e) {
            if (!isDragging) {
                e.preventDefault();
                return;
            }
            isDragging = false;
            setTransition(true);
            if (!dragMoved) {
                // Treat as tap: trigger click on touched image
                const touch = e.changedTouches[0];
                const target = document.elementFromPoint(touch.clientX, touch.clientY);
                if (target && target.classList.contains('letter-img')) {
                    target.click();
                }
                dragOffset = 0;
                e.preventDefault();
                return;
            }
            // No snapping: just clamp to min/max
            let totalOffset = lastOffset + dragOffset;
            if (totalOffset > 0) totalOffset = 0;
            if (totalOffset < -maxPage * pageWidthVW) totalOffset = -maxPage * pageWidthVW;
            lastOffset = totalOffset;
            updateCarousel(lastOffset);
            dragOffset = 0;
            e.preventDefault();
        }, { passive: false });

        // Mouse drag for desktop
        carousel.addEventListener('mousedown', function(e) {
            isDragging = true;
            dragMoved = false;
            setTransition(false);
            startX = e.clientX;
            dragOffset = 0;
            document.body.style.userSelect = 'none';
        });
        window.addEventListener('mousemove', function(e) {
            if (!isDragging) return;
            currentX = e.clientX;
            if (Math.abs(currentX - startX) > 5) dragMoved = true;
            dragOffset = ((currentX - startX) / window.innerWidth) * 100;
            let offsetVW = lastOffset + dragOffset;
            if (offsetVW > 0) offsetVW = 0;
            if (offsetVW < -maxPage * pageWidthVW) offsetVW = -maxPage * pageWidthVW;
            updateCarousel(offsetVW);
        });
        window.addEventListener('mouseup', function(e) {
            if (!isDragging) return;
            isDragging = false;
            setTransition(true);
            if (!dragMoved) {
                // Treat as click: trigger click on image
                const target = document.elementFromPoint(e.clientX, e.clientY);
                if (target && target.classList.contains('letter-img')) {
                    target.click();
                }
                document.body.style.userSelect = '';
                return;
            }
            // No snapping: just clamp to min/max
            let totalOffset = lastOffset + dragOffset;
            if (totalOffset > 0) totalOffset = 0;
            if (totalOffset < -maxPage * pageWidthVW) totalOffset = -maxPage * pageWidthVW;
            lastOffset = totalOffset;
            updateCarousel(lastOffset);
            dragOffset = 0;
            document.body.style.userSelect = '';
        });

        // Keyboard navigation (desktop)
        window.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') showPage(currentPage - 1, true);
            if (e.key === 'ArrowRight') showPage(currentPage + 1, true);
        });
        // Initial state
        showPage(0);
    });
    </script>

    // Video loop logic for mouthRotation.mp4
    const bigMImg = document.getElementById('bigMImg');

    function playMtalkVideo() {
        stopVideo();
        videoPlaying = true;
        video = document.createElement('video');
        video.src = 'mtalk.mp4';
        video.width = 600;
        video.height = 600;
        video.autoplay = true;
        video.loop = false;
        video.muted = true; // mute video, play audio separately
        video.playsInline = true;
        video.style.display = 'none';
        document.body.appendChild(video);

        video.addEventListener('play', function drawFrame() {
            if (!videoPlaying) return;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            animationFrameId = requestAnimationFrame(drawFrame);
        });
        video.addEventListener('ended', function() {
            videoPlaying = false;
            document.body.removeChild(video);
        });
        video.play();
    }
    const bigAImg = document.getElementById('bigAImg');
    const bigLImg = document.querySelector('img[src="bigL.png"]');
    const canvas = document.getElementById('retroCanvas');
    function playLtalkVideo() {
        stopVideo();
        videoPlaying = true;
        video = document.createElement('video');
        video.src = 'lTalk.mp4';
        video.width = 600;
        video.height = 600;
        video.autoplay = true;
        video.loop = false;
        video.muted = true; // mute video, play audio separately
        video.playsInline = true;
        video.style.display = 'none';
        document.body.appendChild(video);

        // Play audio file
        let audio = document.createElement('audio');
        audio.src = 'll.mp3';
        audio.autoplay = true;
        document.body.appendChild(audio);

        // Sync audio with video
        video.addEventListener('play', function drawFrame() {
            if (!videoPlaying) return;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            animationFrameId = requestAnimationFrame(drawFrame);
        });
        video.addEventListener('ended', function() {
            videoPlaying = false;
            document.body.removeChild(video);
            if (audio) {
                audio.pause();
                document.body.removeChild(audio);
            }
        });
        video.play();
        audio.play();
    }
    if (bigLImg) {
        bigLImg.addEventListener('click', playLtalkVideo);
    }

    function startLoopingVideo() {
        if (videoPlaying) return;

        video.width = 600;

        function drawFrame() {
            if (!videoPlaying) return;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            animationFrameId = requestAnimationFrame(drawFrame);
        }
        video.addEventListener('play', drawFrame);
        // Try to play, if fails (mobile), wait for user gesture
        video.play().then(() => { started = true; }).catch(() => {
            // Listen for first user gesture
            const tryStart = () => {
                if (!started) {
                    video.play();
                    started = true;
                }
                window.removeEventListener('touchstart', tryStart);
                window.removeEventListener('mousedown', tryStart);
            };
            window.addEventListener('touchstart', tryStart, { once: true });
            window.addEventListener('mousedown', tryStart, { once: true });
        });
    }

    function stopVideo() {
        if (!videoPlaying) return;
        videoPlaying = false;
        if (animationFrameId) cancelAnimationFrame(animationFrameId);
        if (video) {
            video.pause();
            document.body.removeChild(video);
            video = null;

        // Optionally clear the canvas
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
